	window.StarlightThemeProvider = (() => {

		if (hasStorage && localStorage.getItem('starlight-theme') === null) {
			try { localStorage.setItem('starlight-theme', 'light'); } catch {}
		}
		const storedTheme = hasStorage && localStorage.getItem('starlight-theme');
		let theme = storedTheme || 'auto';

			theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		}
		document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
		return {

				document.querySelectorAll('starlight-theme-select').forEach((picker) => {
					const select = picker.querySelector('select');
					if (select) select.value = theme;
					/** @type {HTMLTemplateElement | null} */
					const tmpl = document.querySelector(`#theme-icons`);

					if (newIcon) {
						const oldIcon = picker.querySelector('svg.label-icon');
						if (oldIcon) {
							oldIcon.replaceChildren(...newIcon.cloneNode(true).childNodes);
						}
					}
				});
			},
		};
	})();

	// Sovereign Documentation Access Gate (PBKDF2-HMAC-SHA256 310,000 iterations + AES-256-GCM payload decryption)
	(() => {
		const KEY_STORAGE = 'neo_docs_key_v2';
		const FAILS_STORAGE = 'neo_docs_fails_v2';
		const LOCK_STORAGE = 'neo_docs_lock_until_v2';
		const PBKDF2_SALT = 'neomorphic-ssii-2026-pbkdf2-v2';
		const PBKDF2_ITERS = 310000;
		// SHA-256(PBKDF2-derived 256-bit key) — one-way verifier; cannot decrypt AES-256-GCM payload without password
		const EXPECTED_VERIFIER = 'ed2016881993578201b591676b960ab6c50cd92c6c07a92e22782eedbef7e838';

		function bytesToHex(bytes) {
			return Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
		}

		function hexToBytes(hex) {
			const out = new Uint8Array(hex.length / 2);
			for (let i = 0; i < out.length; i++) {
				out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
			}
			return out;
		}

		function b64ToBytes(b64) {
			const bin = atob(b64);
			const out = new Uint8Array(bin.length);
			for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
			return out;
		}

		async function deriveKeyBytes(password) {
			const enc = new TextEncoder();
			const baseKey = await crypto.subtle.importKey(
				'raw',
				enc.encode(password),
				'PBKDF2',
				false,
				['deriveBits']
			);
			const bits = await crypto.subtle.deriveBits(
				{
					name: 'PBKDF2',
					salt: enc.encode(PBKDF2_SALT),
					iterations: PBKDF2_ITERS,
					hash: 'SHA-256',
				},
				baseKey,
				256
			);
			return new Uint8Array(bits);
		}

		async function sha256HexBytes(bytes) {
			const digest = await crypto.subtle.digest('SHA-256', bytes);
			return bytesToHex(new Uint8Array(digest));
		}

		async function decryptAndMount(keyBytes) {
			const payloadEl = document.getElementById('neo-encrypted-main');
			if (payloadEl) {
				const data = JSON.parse(payloadEl.textContent || '{}');
				const aesKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
				const plainBuf = await crypto.subtle.decrypt(
					{ name: 'AES-GCM', iv: b64ToBytes(data.iv) },
					aesKey,
					b64ToBytes(data.ct)
				);
				const html = new TextDecoder().decode(plainBuf);
				const mainEl = payloadEl.closest('main') || document.querySelector('main');
				if (mainEl) {
					mainEl.innerHTML = html;
					mainEl.querySelectorAll('video, audio').forEach((media) => {
						media.addEventListener('contextmenu', (e) => e.preventDefault());
					});
				}
			}
			document.documentElement.setAttribute('data-neo-unlocked', 'true');
			const gate = document.getElementById('neo-auth-gate');
			if (gate) gate.remove();
		}

		async function tryAutoUnlock() {
			try {
				const savedHex = sessionStorage.getItem(KEY_STORAGE);
				if (!savedHex || savedHex.length !== 64) return false;
				const keyBytes = hexToBytes(savedHex);
				const verifier = await sha256HexBytes(keyBytes);
				if (verifier !== EXPECTED_VERIFIER) {
					sessionStorage.removeItem(KEY_STORAGE);
					return false;
				}
				const run = () => decryptAndMount(keyBytes).catch(() => sessionStorage.removeItem(KEY_STORAGE));
				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', run, { once: true });
				} else {
					await run();
				}
				return true;
			} catch {
				return false;
			}
		}

		function mountGate() {
			if (document.documentElement.getAttribute('data-neo-unlocked') === 'true') return;
			if (document.getElementById('neo-auth-gate')) return;
			const gate = document.createElement('div');
			gate.id = 'neo-auth-gate';
			gate.setAttribute('role', 'dialog');
			gate.setAttribute('aria-modal', 'true');
			gate.setAttribute('aria-labelledby', 'neo-gate-title');
			gate.innerHTML = `
				<div class="neo-gate__card">
					<div class="neo-gate__eyebrow">
						<span class="neo-gate__dot" aria-hidden="true"></span>
						<span>NEOMORPHIC™ · PROTECTED DOCUMENTATION</span>
					</div>
					<h1 class="neo-gate__title" id="neo-gate-title">Enter Access Password</h1>
					<p class="neo-gate__desc">
						Technical architecture, verified benchmarks, and sovereign briefing materials are encrypted with AES-256-GCM and require authorized access.
					</p>
					<form class="neo-gate__form" id="neo-gate-form" autocomplete="off">
						<div class="neo-gate__input-wrap">
							<input
								type="password"
								id="neo-gate-input"
								class="neo-gate__input"
								placeholder="Password"
								required
								autofocus
								aria-label="Documentation password"
							/>
						</div>
						<button type="submit" id="neo-gate-submit" class="neo-gate__btn">Unlock Documentation</button>
						<p class="neo-gate__error" id="neo-gate-error" role="alert" aria-live="polite"></p>
					</form>
					<div class="neo-gate__footer">
						<span>SSII Architecture · AES-256-GCM</span>
						<a href="/" class="neo-gate__back">← Return to neomorphic.si</a>
					</div>
				</div>
			`;
			document.body.prepend(gate);

			const form = document.getElementById('neo-gate-form');
			const input = document.getElementById('neo-gate-input');
			const submitBtn = document.getElementById('neo-gate-submit');
			const errorEl = document.getElementById('neo-gate-error');
			setTimeout(() => input && input.focus(), 50);

			function checkLockout() {
				try {
					const until = Number(sessionStorage.getItem(LOCK_STORAGE) || '0');
					const rem = Math.ceil((until - Date.now()) / 1000);
					if (rem > 0) {
						submitBtn.disabled = true;
						input.disabled = true;
						errorEl.textContent = `Too many failed attempts. Please wait ${rem}s before retrying.`;
						setTimeout(checkLockout, 1000);
						return true;
					} else if (submitBtn.disabled) {
						submitBtn.disabled = false;
						input.disabled = false;
						errorEl.textContent = '';
						input.focus();
					}
				} catch {}
				return false;
			}
			checkLockout();

			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				if (checkLockout()) return;
				const raw = (input.value || '').trim().toLowerCase();
				if (!raw) return;
				submitBtn.disabled = true;
				try {
					const keyBytes = await deriveKeyBytes(raw);
					const verifier = await sha256HexBytes(keyBytes);
					if (verifier === EXPECTED_VERIFIER) {
						try {
							sessionStorage.setItem(KEY_STORAGE, bytesToHex(keyBytes));
							sessionStorage.removeItem(FAILS_STORAGE);
							sessionStorage.removeItem(LOCK_STORAGE);
						} catch {}
						await decryptAndMount(keyBytes);
					} else {
						let fails = 1;
						try {
							fails = Number(sessionStorage.getItem(FAILS_STORAGE) || '0') + 1;
							sessionStorage.setItem(FAILS_STORAGE, String(fails));
							if (fails >= 3) {
								const delaySec = Math.min(60, 5 * Math.pow(2, fails - 3));
								sessionStorage.setItem(LOCK_STORAGE, String(Date.now() + delaySec * 1000));
							}
						} catch {}
						submitBtn.disabled = false;
						if (!checkLockout()) {
							errorEl.textContent = 'Invalid access password. Please try again.';
							input.value = '';
							input.focus();
						}
					}
				} catch {
					submitBtn.disabled = false;
					errorEl.textContent = 'Unable to verify credentials. Please try again.';
				}
			});
		}

		tryAutoUnlock().then((unlocked) => {
			if (!unlocked) {
				if (document.body) mountGate();
				else document.addEventListener('DOMContentLoaded', mountGate, { once: true });
			}
		});
	})();
